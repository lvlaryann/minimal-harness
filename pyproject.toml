[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-harness"
version = "0.1.0"
description = "Minimal Harness with adversarial review and Docker gates"
requires-python = ">=3.11"
dependencies = ["PySide6"]

[project.optional-dependencies]
dev = ["black>=26.5", "playwright>=1.50"]

[project.scripts]
harness-search = "meta_harness.cli:main"
harness-gui = "gui.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["meta_harness*", "gui*"]

[tool.setuptools.package-data]
meta_harness = ["prompts/*.md"]
gui = ["assets/*.png"]

[tool.black]
line-length = 79
